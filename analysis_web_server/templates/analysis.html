<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIMBOX Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --sidebar-w: 400px; --accent: #2563eb; }
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;   /* only block horizontal page scroll */
            overflow-y: hidden;
            font-family: 'Segoe UI', sans-serif;
         }

        
        #layout { display: flex; height: 100vh; width: 100vw; }
        
        #sidebar {
            width: var(--sidebar-w);
            background: #1e293b; 
            color: white;  
            box-sizing: border-box;
            max-height: calc(160vh - 120px); /* Adjust the height as needed */
            overflow-y: auto;

            z-index: 1001;
        }

        /* Add margin-bottom to the last section in the sidebar */
        .sidebar-section:last-child {
            margin-bottom: 20px; /* Adjust the margin as needed */
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 20px 0;
            opacity: 0.6;
        }

        .sidebar-section {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 20px;
        }

        #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #f8fafc; position: relative; }

        
        .tabs { 
            height: 60px; 
            background: white; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            gap: 10px;
            flex-shrink: 0;
        }

        #dbTable th,
        #dbTable td {
            white-space: nowrap;
        }

        #dbTable thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9; /* Light gray header */
            z-index: 10;
            border-bottom: 2px solid #cbd5e1;
        }

        .tab-btn { padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: 600; color: #64748b; border: 1px solid transparent; }
        .tab-btn.active { background: #eff6ff; color: var(--accent); border-color: #dbeafe; }
        
        /* Map must have flex: 1 to fill the #main container */
        .tab-content { flex: 1; display: none; flex-direction: column; width: 100%; overflow: hidden; }
        .tab-content.active { display: flex; }
        
        #map { width: 100%; height: 100%; flex: 1; }

        .stats-container { flex: 1; overflow-y: auto; margin-top: 20px; }
        .local-stat-box { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid var(--accent); font-size: 13px; }
        
        .btn-upload { background: var(--accent); color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }
        input[type="file"] { margin-bottom: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="layout">
    <div id="sidebar">
        <h2 style="margin-top:0">SIMBOX Analysis</h2>

        <div class="sidebar-section">
            <h3 style="margin-top:20px;">Map Filter</h3>
            <p style="font-size: 13px; color: #94a3b8;">Filter Map by Session</p>
            <select id="mapSessionSelector" onchange="loadMapData(this.value)" style="width:100%; padding:8px;">
                <option value="All Sessions">All Sessions</option>
            </select>
        </div>

        <hr class="sidebar-divider">
        
        <div class="sidebar-section"> 
            <h3 style="margin-top:20px;">Load New CSV</h3>  
            <form action="/upload" method="post" enctype="multipart/form-data" style="margin-bottom:20px;">
                <input type="file" name="file" required>
                <button class="btn-upload">IMPORT DATA</button>
            </form>
        </div>

        <div class="sidebar-section">
            <h3 style="margin-top:20px;">Load Existing CSV</h3>
            <select id="csvSelector" style="width:100%; padding:8px; margin-bottom:10px;"></select>
            <button class="btn-upload" onclick="loadSelectedFile()">LOAD SELECTED</button>
        </div>

        <hr class="sidebar-divider">

        <div class="sidebar-section">
        <h3 style="margin-top:20px;">Fuse Phone Results</h3>
        <input type="file" id="jsonFile" accept=".json" style="margin-bottom:8px;">

        <p style="font-size: 13px; color: #94a3b8;">Region</p>
        <select id="regionSelector" style="width:100%; padding:8px; margin-bottom:8px;">
            <option value="IL">Israel (IL)</option>
            <option value="US">United States (US)</option>
            <option value="CL">Chile (CL)</option>
            <option value="DE">Germany (DE)</option>
            <option value="GB">United Kingdom (GB)</option>
        </select>

        <p style="font-size: 13px; color: #94a3b8;">Approximate time difference between phone and simbox</p>
        <input type="number" id="timeOffset" placeholder="Time diff (seconds)" value="15"
            style="width:100%; padding:8px; margin-bottom:8px;">
        <button class="btn-upload" onclick="fuseResults()">FUSE</button>
        </div>

        <hr class="sidebar-divider">

        <div class="stats-container">
            <h3 style="color:var(--accent); font-size: 16px;">Grid Details</h3>
            <p id="gridHint" style="font-size: 13px; color: #94a3b8;">Click a colored square on the map to see localized PCI and ARFCN stats.</p>
            <div id="localStats"></div>
        </div>
    </div>

    <div id="main">
        <div class="tabs">
            <div class="tab-btn active" onclick="showTab('mapTab')">Map</div>
            <div class="tab-btn" onclick="showTab('chartTab')">Charts</div>
            <div class="tab-btn" onclick="showTab('tableTab')">Database</div>
            <div class="tab-btn" onclick="showTab('modemsTab')">Modems</div>
        </div>

        <div id="mapTab" class="tab-content active">
            <div id="map"></div>
        </div>

        <div id="chartTab" class="tab-content" style="padding:30px; box-sizing: border-box;">
            <label style="font-weight:bold; margin-bottom:8px;">Filter by Session:</label>
            <select id="sessionSelector" onchange="loadChart(this.value)" style="padding:10px; width:100%; max-width:400px; margin-bottom:20px;"></select>
            <div style="background:white; padding:20px; border-radius:10px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
                <canvas id="providerChart"></canvas>
            </div>
        </div>

        <div id="tableTab" class="tab-content" style="padding:20px; box-sizing: border-box; min-height: 0;">
            <input
                type="text"
                id="tableSearch"
                placeholder="Search..."
                style="padding:8px; width:300px; margin-bottom:10px;"
                oninput="loadTable()"
            >

             <div style="flex: 1; overflow: auto; border: 1px solid #e2e8f0; margin-top: 10px;">
             <table id="dbTable" style="border-collapse:collapse; width: max-content; background: white;">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="modemsTab" class="tab-content" style="padding:20px; overflow:auto;">
            <div id="modemsContainer" style="
                display:grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap:15px;
            "></div>
        </div>

        
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    let map, chart;
    const gridLayer = L.layerGroup();
    const markerLayer = L.layerGroup();

    // Function to collapse/expand side bar
    function toggleSection(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === "none") ? "block" : "none";
    }

    function initMap() {
        // Initialize Map
        map = L.map('map').setView([32.09, 34.85], 2);
        
        // Fix overlap: Grid pane is lower than Marker pane
        map.createPane('gridPane');
        map.getPane('gridPane').style.zIndex = 399;

        // Base Layers
        const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 24,          // allow deep zoom
            maxNativeZoom: 19     // actual tile resolution

        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 24,           // allow deep zoom
            maxNativeZoom: 19,     // actual tile resolution
            attribution: 'Esri'
        });

        street.addTo(map);
        L.control.layers({"Street": street, "Satellite": satellite}).addTo(map);
        
        // Add Search
        L.Control.geocoder({ defaultMarkGeocode: false })
            .on('markgeocode', function(e) { map.fitBounds(e.geocode.bbox); })
            .addTo(map);

        gridLayer.addTo(map);
        markerLayer.addTo(map);
    }

    function showTab(id) {
        $('.tab-content').removeClass('active');
        $('.tab-btn').removeClass('active');
        $(`#${id}`).addClass('active');
        $(event.target).addClass('active');
        
        // Crucial: Tell Leaflet the container changed size
        if(id === 'mapTab') {
            setTimeout(() => { map.invalidateSize(); }, 100);
        }

        if(id === 'tableTab') {
        loadTable();
        }

        if(id === 'modemsTab') {
            loadModems();
        }
    }

    // Adds a tiny random offset (approx 1-2 meters) to coordinates so that multiple modems in the same location don't perfectly overlap on the map
    function applyJitter(lat, lng) {
        const jitterAmount = 0.000005; // Adjust this for more/less spread
        return [
            lat + (Math.random() - 0.5) * jitterAmount,
            lng + (Math.random() - 0.5) * jitterAmount
        ];
    }

    // Fetch and Load Data. Need to delete this?
    fetch('/get_data').then(r => r.json()).then(data => {
        if(data.error) return;
        const bounds = []; 
    });

    // Load chart data for selected session
    function loadChart(session) {
        fetch(`/get_chart_data/${session}`).then(r => r.json()).then(data => {
            if(chart) chart.destroy();
            chart = new Chart(document.getElementById('providerChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(data),
                    datasets: [{ label: 'Avg Success Rate %', data: Object.values(data), backgroundColor: '#3b82f6' }]
                },
                options: {
                    plugins: {
                        legend: {
                            labels: {
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                font: {
                                    size: 14
                                }
                            }
                        }
                    }
                }

            });
        });
    }

    function loadTable() {

        const search = document.getElementById('tableSearch').value;

        fetch(`/get_table?search=${encodeURIComponent(search)}`)
        .then(r => r.json())
        .then(rows => {

            const table = document.getElementById('dbTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (!rows.length) return;

            // headers
            const headers = Object.keys(rows[0]);
            const headRow = document.createElement('tr');

            headers.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h;
                th.style.border = "1px solid #ccc";
                th.style.padding = "6px";
                headRow.appendChild(th);
            });

            thead.appendChild(headRow);

            // rows
            rows.forEach(r => {

                const tr = document.createElement('tr');

                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.innerText = r[h];
                    td.style.border = "1px solid #ddd";
                    td.style.padding = "6px";
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);

            });

        });
    }

        function loadModems() {

        fetch('/get_modems')
            .then(r => r.json())
            .then(modems => {

                const container = document.getElementById('modemsContainer');
                container.innerHTML = '';
                modems.sort((a, b) => a.MODEM_NUMBER - b.MODEM_NUMBER);
                modems.forEach(m => {

                    let color = '#ef4444';
                    if (m.SUCCESS_RATE >= 80) color = '#22c55e';
                    else if (m.SUCCESS_RATE >= 50) color = '#eab308';

                    let html = `
                        <div style="
                            background:white;
                            border-radius:10px;
                            padding:15px;
                            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                            border-left: 5px solid ${color};
                            font-size:13px;
                        ">
                            <h3 style="margin-top:0; color:#2563eb;">
                                Modem #${m.MODEM_NUMBER}
                            </h3>
                    `;

                    for (let [key, value] of Object.entries(m)) {

                        // Pretty JSON arrays
                        if (typeof value === 'string' && value.startsWith('[')) {
                            try {
                                value = JSON.parse(value).join(', ');
                            } catch(e){}
                        }

                        html += `
                            <div style="
                                padding:4px 0;
                                border-bottom:1px solid #eee;
                            ">
                                <b>${key}</b>: ${value}
                            </div>
                        `;
                    }

                    html += `</div>`;

                    container.innerHTML += html;
                });
            });
    }
    
    loadCsvList();
    initMap();
    loadMapData(); // Initial load


    // Load map data - markers , grids and everything
    function loadMapData(session = "All Sessions") {
        // Clear existing map layers before loading new ones
        gridLayer.clearLayers();
        markerLayer.clearLayers();

        fetch(`/get_data?session=${encodeURIComponent(session)}`)
            .then(r => r.json())
            .then(data => {
                if(data.error) return;

                // 1. Populate the Map Filter Dropdown (only once or update if needed)
                const mapSel = document.getElementById('mapSessionSelector');
                if (mapSel.options.length <= 1) { // Only populate if empty (except "All Sessions")
                    data.sessions.forEach(s => {
                        const o = document.createElement('option');
                        o.value = o.text = s;
                        mapSel.add(o);
                    });
                }

                // 1. Modems Markers
                data.markers.forEach(m => {
                // 1. Apply jitter so overlapping modems are visible
                const [jitterLat, jitterLng] = applyJitter(m.LATITUDE, m.LONGITUDE);

                let markerColor;

                if (m.SUCCESS_RATE === null || m.SUCCESS_RATE === undefined || m.ARFCN === null || m.ARFCN === undefined) {
                    markerColor = '#9ca3af';   // Gray (not registered / no calls)
                } 
                else if (m.SUCCESS_RATE >= 80) {
                    markerColor = '#22c55e';   // Green
                } 
                else if (m.SUCCESS_RATE >= 50) {
                    markerColor = '#eab308';   // Yellow
                } 
                else {
                    markerColor = '#ef4444';   // Red
                }

                const radius = 6 + (m.SUCCESS_RATE ? m.SUCCESS_RATE / 20 : 0);

                const marker = L.circleMarker([jitterLat, jitterLng], {
                    radius: radius,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: markerColor,
                    fillOpacity: 0.9
                }).addTo(markerLayer);


                let lastSelectedMarker = null;

                // When marker is clicked, show detailed stats in the sidebar
                marker.on('click', function(e) {

                    if (map.getZoom() < 10) {
                        map.flyTo(e.latlng, 18, {
                            animate: true,
                            duration: 1.0
                        });
                    }
                    else {
                        map.flyTo(e.latlng, map.getZoom(), {
                            animate: true,
                            duration: 1.0
                        });
                    }

                    if (lastSelectedMarker) {
                        lastSelectedMarker.setStyle({ weight: 1 });
                    }

                    marker.setStyle({ weight: 3 });
                    lastSelectedMarker = marker;

                    $('#gridHint').hide();

                    let html = `<h4 style="margin:15px 0 10px 0; color:var(--accent)">
                        Modem #${m.MODEM_NUMBER}
                    </h4>`;

                    for (let [key, value] of Object.entries(m)) {

                        // Pretty format for arrays or JSON strings
                        if (typeof value === 'string' && value.startsWith('[')) {
                            try {
                                value = JSON.parse(value).join(', ');
                            } catch(e){}
                        }

                        html += `
                            <div class="local-stat-box">
                                <b>${key}</b>: ${value}
                            </div>
                        `;
                    }

                    $('#localStats').html(html);
                });

                // 2. Verbose Tooltip (Shown on Hover)
                const verboseInfo = `
                    <div style="font-family: sans-serif; line-height: 1.4;font-size:20px;">
                        <b style="color:#2563eb; font-size:20px;">Modem #${m.MODEM_NUMBER}</b><br/>
                        <hr style="margin: 5px 0; border: 0; border-top: 1px solid #eee;"/>
                        <b>Operator:</b> ${m.OPERATOR} (${m.RAT})<br/>
                        <b>Signal:</b> RSSI: ${m.RSSI} | SNR: ${m.SNR}<br/>
                        <b>Cell ID:</b> ${m.CELL_ID} (PCI: ${m.PCI})<br/>
                        <b>ARFCN:</b> ${m.ARFCN}<br/>
                        <b>IMEI:</b> <span style="font-family:monospace;">${m.IMEI}</span><br/>
                        <b>IMSI:</b> <span style="font-family:monospace;">${m.IMSI}</span><br/>
                        <b>Time:</b> ${new Date(m.TIMESTAMP).toLocaleTimeString()}<br/>
                        <b>Date:</b> ${new Date(m.TIMESTAMP).toLocaleDateString()}<br/>
                        <b>Call Results:</b> ${m.CALL_RESULT} <br/>
                        <b>Call Success rate:</b> ${m.SUCCESS_RATE.toFixed(1)}% <br/>
                        <b>Session:</b> ${m.SESSION_NAME}<br/>
                    </div>
                `;

                marker.bindTooltip(verboseInfo, {
                    sticky: true, // Tooltip follows the mouse
                    direction: 'top',
                    opacity: 0.95
                });
            });

            // 2. Grid Squares
            data.grid.forEach(g => {
                const rates = Object.values(g.operators);
                const avg = rates.reduce((a, b) => a + b, 0) / rates.length;
                const color = avg > 80 ? '#22c55e' : (avg > 50 ? '#eab308' : '#ef4444');

                const rect = L.rectangle(
                    [[g.lat - 0.0001, g.lng - 0.0001], [g.lat + 0.0001, g.lng + 0.0001]],
                    { color: color, weight: 1, fillOpacity: 0.3, pane: 'gridPane' }
                ).addTo(gridLayer);

                let tip = `<b>Area Summary</b><br>`;
                for (let [op, rate] of Object.entries(g.operators)) {
                    tip += `${op}: ${rate}% Success<br>`;
                }
                rect.bindTooltip(tip);

                // Handle Grid Click for Local Stats
                rect.on('click', () => {
                    $('#gridHint').hide();
                    let html = `<h4 style="margin:15px 0 10px 0; color:var(--accent)">Area Stats</h4>`;
                    
                    html += `<b>EARFCN / PCI Distribution:</b>`;

                    for (let [pair, perc] of Object.entries(g.pair_dist)) {
                        html += `<div class="local-stat-box">${pair}: <b>${perc}%</b></div>`;
                    }
                    $('#localStats').html(html);
                });
            });

            // 3. Populate Sessions
            const sel = document.getElementById('sessionSelector');
            data.sessions.forEach(s => {
                const o = document.createElement('option');
                o.value = o.text = s;
                sel.add(o);
            });
            if(data.sessions.length) loadChart(data.sessions[0]);
            });
    }

    // Load existing CSV files into the selector
    function loadCsvList() {
        fetch('/list_uploads')
            .then(r => r.json())
            .then(files => {
                const sel = document.getElementById('csvSelector');
                sel.innerHTML = '';

                files.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = opt.text = f;
                    sel.add(opt);
                });
            });
    }
    // Load the selected CSV file and refresh the map
    function loadSelectedFile() {
    const filename = document.getElementById('csvSelector').value;

        fetch(`/load_file/${filename}`)
            .then(r => r.json())
            .then(res => {
                if(res.status === "loaded") {
                    location.reload();  // refresh map data
                }
            });
    }

    // Function to fuse phone call data into SIMBOX events
    function fuseResults() {
        const fileInput = document.getElementById('jsonFile');
        const offset = document.getElementById('timeOffset').value || 0;
        const region = document.getElementById('regionSelector').value;

        if (!fileInput.files.length) {
            alert("Select JSON file first");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('offset', offset);
        formData.append('region', region);

        fetch('/fuse_results', {
            method: 'POST',
            body: formData
        })
        .then(r => r.json())
        .then(res => {
            if (res.status === "done") {
                alert(
                    "Fuse Completed\n\n" +
                    "Fused: " + res.fused + "\n" +
                    "Already OK: " + res.already_ok + "\n" +
                    "No Match: " + res.no_match
                );
                location.reload();
            } else {
                alert("Error: " + res.error);
            }
        });

    }



</script>

</body>
</html>
